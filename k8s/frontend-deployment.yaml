apiVersion: apps/v1
kind: Deployment
metadata:
  name: innovatech-frontend
  namespace: innovatech
spec:
  replicas: 2
  selector:
    matchLabels:
      app: innovatech-frontend
  template:
    metadata:
      labels:
        app: innovatech-frontend
    spec:
      containers:
        - name: innovatech-frontend
          image: 673278830595.dkr.ecr.us-east-1.amazonaws.com/innovatech-frontend:eks-v1
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "300m"
              memory: "512Mi"
